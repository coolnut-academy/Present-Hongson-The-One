name: Deploy HONGSON THE ONE to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hongson-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Compute Vite base path
        shell: bash
        env:
          OVERRIDE_BASE: ${{ vars.VITE_BASE_PATH }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ -n "$OVERRIDE_BASE" ]]; then
            BASE="$OVERRIDE_BASE"
          elif [[ "$REPO_NAME" == *.github.io ]]; then
            BASE='/'
          else
            BASE="/$REPO_NAME/"
          fi
          echo "VITE_BASE_PATH=$BASE" >> "$GITHUB_ENV"
          echo "Vite base path: $BASE"

      - name: Install dependencies
        run: npm ci

      - name: Build static application
        run: npm run build

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      # 1. Deploy via GitHub Actions (if Pages Source = GitHub Actions)
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 2. Deploy to gh-pages branch (if Pages Source = Deploy from a branch -> gh-pages)
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
